apiVersion: pmcro.ai/v1
kind: ExecutionPolicy
spec:
  policyReferences:
    permissions: policies/permissions.yaml
    network: policies/network.yaml
  defaults:
    denyUnknownCapabilities: true
    requireEvidenceForCompletion: true
    requireCheckerPass: true
    requireApprovalForMutation: true
    redactSecretsFromEvidence: true
  capabilities:
    github:
      read: allow
      write: require-approval
      destructive: require-approval
    browser:
      read: allow
      interaction: policy
      destructive: require-approval
    containers:
      inspect: allow
      start: policy
      stop: require-approval
      destroy: require-approval
    mcp-gateway:
      inspect: allow
      profile-read: allow
      profile-mutate: require-approval
      catalog-read: allow
      catalog-publish: require-approval
    host-command-execution:
      default: allow
      explicitApproval: required
      allowedProfiles: ["*"]
    filesystem:
      workspaceRead: allow
      workspaceWrite: require-approval
      outsideWorkspace: deny
  evidence:
    minimum:
      - capability
      - provider
      - action
      - outcome
      - timestamp
      - artifact-or-reference
