apiVersion: pmcro.ai/v1
kind: ProviderRegistry
spec:
  # No providers configured. The archive's registry listed GitHub MCP,
  # Playwright MCP, Docker MCP Toolkit, a "maf-native" tooling provider,
  # and a "pmcro-runtime" provider — none exist in this repo. Rather than
  # copy entries this repo can't back up, or invent neutral placeholders
  # that would just be a different fiction, this is left empty on
  # purpose. See ../README.md "Source and adaptation".
  providers: {}
  rules:
    - Existing authoritative providers remain the implementation boundary.
    - PMCRO owns capability policy, routing, evidence, lifecycle, and governance.
    - Terminal is reserved for explicit host-command execution and is always governed.
    - Credentials are supplied by the runtime configuration/secret provider, not provider registry files.
    - A capability with no provider entry here produces an escalated governed result, never an invented integration.
