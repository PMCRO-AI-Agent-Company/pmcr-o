apiVersion: pmcro.ai/v1
kind: McpRegistry
spec:
  principle: capabilities-not-orchestration
  # Most of the archive's MCP routing (github, browser, mcp-gateway,
  # containers, host-command-execution) still is not wired in this repo.
  # See providers/registry.yaml and ../README.md "Source and adaptation".
  # desktop-commander below is the first real exception.
  providers:
    - id: desktop-commander
      capability: host-device-bridge
      transport: local-mcp-proxied-through-remote-device-bridge
      status: wired
      evidence_trail: 9eff95df-7b96-4bde-b1e2-e180d2da26c3
  routing:
    host-device-bridge: desktop-commander
  rules:
    - Prefer authoritative providers over PMCRO provider reimplementations.
    - Terminal remains a separate high-risk capability for arbitrary host commands.
    - Build a PMCRO adapter only when it adds PMCRO-owned policy, evidence, lifecycle, audit, or domain semantics.
    - Provider credentials remain external to this registry.
